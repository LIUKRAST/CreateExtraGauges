name: Publish Release

on:
  workflow_dispatch:
    inputs:
      major_release:
        description: "Major release"
        required: true
        type: boolean
        default: false
      curseforge:
        description: "CurseForge"
        type: boolean
        default: true
      modrinth:
        description: "Modrinth"
        type: boolean
        default: true
      maven:
        description: "Maven"
        type: boolean
        default: true
      discord:
        description: "Discord"
        type: boolean
        default: true

jobs:
  call-shared-workflow:
    uses: LIUKRAST/LIUKRAST/.github/workflows/publish.yml@main
    with:
      major_release: ${{ inputs.major_release }}
      curseforge: ${{ inputs.curseforge }}
      modrinth: ${{ inputs.modrinth }}
      maven: ${{ inputs.maven }}
      discord: ${{ inputs.discord }}
    permissions:
      contents: write
    secrets: inherit
