name: Publish Release

on:
  workflow_dispatch:
    inputs:
      major_release:
        description: "Major release"
        required: true
        type: boolean
        default: false

jobs:
  call-shared-workflow:
    uses: LIUKRAST/LIUKRAST/.github/workflows/publish.yml@main
    with:
      major_release: ${{ inputs.major_release }}
    permissions:
      contents: write
    # all repo secrets (MODRINTH_TOKEN, CURSEFORGE_TOKEN, SSH_HOST, SSH_KEY, DISCORD_WEBHOOK)
    secrets: inherit
